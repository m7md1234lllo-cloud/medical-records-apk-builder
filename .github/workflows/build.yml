name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-8-jdk unzip zip
        pip install buildozer cython==0.29.33

    - name: Extract
      run: unzip medical_records_app_ANDROID.zip

    - name: Build
      run: |
        cd medical_records_app/android
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: medical_records_app/android/bin/*.apk
